<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Job Application Portal</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="container">
    <!-- REGISTRATION FORM -->
    <div id="registerForm">
        <h1>Online Job Application Portal</h1>
        <h2>Register to Access the Job Application Form</h2>
        <form>
            <!-- Full Name -->
            <label for="name">Full Name</label>
            <input
                type="text"
                id="name"
                placeholder="Enter your full name">
            <small class="error" id="nameError"></small>

            <!-- Email -->
            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                placeholder="Enter your email">
            <small class="error" id="emailError"></small>

            <!-- Phone -->
            <label for="phone">Phone Number</label>
            <input
                type="text"
                id="phone"
                placeholder="Enter your phone number">
            <small class="error" id="phoneError"></small>

            <!-- Password -->
            <label>Password</label>
            <div class="password-box">
                <input
                    type="password"
                    id="password"
                    placeholder="Enter password">
                <i
                    class="fa-solid fa-eye"
                    id="togglePassword">
                </i>
            </div>

            <small class="error" id="passwordError"></small>

            <!-- Confirm Password -->
            <label>Confirm Password</label>
            <div class="password-box">
                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Re-enter password">
                <i
                    class="fa-solid fa-eye"
                    id="toggleConfirmPassword">
                </i>
            </div>
            <small class="error" id="confirmPasswordError"></small>

            <!-- Register Button -->
            <button
                type="button"
                id="registerBtn">
                Register
            </button>
        </form>
    </div>
    <!-- JOB APPLICATION FORM -->

    <div id="applicationForm" style="display:none;">
        <h2>Job Application Form</h2>
        <form>
            <!-- Position -->
            <label for="position">Position</label>
            <select id="position">
                <option value="">Select Position</option>
                <option>Software Developer</option>
                <option>Web Developer</option>
                <option>AI Engineer</option>
                <option>Data Analyst</option>
                <option>Machine Learning Engineer</option>
            </select>
            <small class="error" id="positionError"></small>

            <!-- Job Level -->
            <label for="jobLevel">Job Level</label>
            <select id="jobLevel">
                <option value="">Select Job Level</option>
                <option>Intern</option>
                <option>Fresher</option>
                <option>Junior</option>
                <option>Senior</option>
            </select>
            <small class="error" id="jobLevelError"></small>

            <!-- Experience -->
            <label for="experience">Experience (Years)</label>
            <input
                type="number"
                id="experience"
                placeholder="Enter years of experience">
            <small class="error" id="experienceError"></small>

            <!-- Skills -->
            <label for="skills">Skills</label>
            <input
                type="text"
                id="skills"
                placeholder="Example: HTML, CSS, JavaScript">
            <small class="error" id="skillsError"></small>

            <!-- Project Description -->
            <label for="projects">Describe Your Projects</label>
            <textarea
                id="projects"
                rows="5"
                placeholder="Describe your projects (Minimum 50 characters)"></textarea>
            <small class="error" id="projectsError"></small>

            <!-- Resume Upload -->
            <label for="resume">Upload Resume</label>
            <input
                type="file"
                id="resume"
                accept=".pdf,.doc,.docx">
            <small class="error" id="resumeError"></small>

            <!-- Submit Button -->
            <button
                type="button"
                id="submitBtn">
                Submit Application
            </button>
        </form>
    </div>
</div>

<!-- JavaScript -->
<script src="script.js"></script>
</body>
</html>
